<html lang="en">
<head>
    <style>

        div{
width: 300px;
height: 300px;
background: #000;
margin: 50px;
        }
        #static{
            background-image: url("_I-SEE-YOU.gif");
            background-size: cover;
          position: static; /*default*/
          
        }
        #sticky{
            background-image: url("_I-SEE-YOU.gif");
            background-size: cover;
            position: sticky;
        }
        #relative{
            background-image: url("_I-SEE-YOU.gif");
            background-size: cover;
            position: relative;
            left: 200px;
            top: -100px;
            z-index: -10;
        }
        #fixed{
            background-image: url("_I-SEE-YOU.gif");
            background-size: cover;
            position: fixed;
            top: 50px;
            right: 100px;
        }
        #absolute{
            background-image: url("_I-SEE-YOU.gif");
            background-size: cover;
            position: absolute;
            right: 30px;
            bottom: 50px;
        }
    </style>
</head>

    <body>
<div id="static"></div>
<div id="sticky"></div>
<div id="relative"></div>
<div id="fixed"></div>
<div id="absolute"></div>
    <body/>
</html>
